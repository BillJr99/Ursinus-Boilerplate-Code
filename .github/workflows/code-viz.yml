# code-viz: build every labeled example and publish the course's viz/ folder (shared workflow).
#
# Course repos call this from their own .github/workflows/code-viz.yml (template:
# course/viz/workflow.yml). Full manual: course/viz/code-viz, section 16 CI.
#
# What it does, on the course repo's branch that started it (gh-pages):
#   1. Stops at once, changing nothing, when the repo has no code-viz labels (<!-- run: ... -->
#      in _pages/), no listed notebook examples (viz/notebooks.json) and no viz/ site yet. Most parent repos are like that today.
#   2. Gets code-viz: Ursinus-Boilerplate-Code at the commit the repo's code submodule points at
#      (Boilerplate main when there is no submodule; fails if that commit is missing), cloned
#      outside the repo (runner temp).
#   3. Runs `code-viz build --check` with the runner's own Docker: every labeled example and
#      viz/manifest.json entry, except recorded agent examples (Ollama), whose committed
#      recordings are kept. It fails, and publishes nothing, when an example stopped running.
#   4. Refuses to publish when anything outside viz/ changed, so pages, syllabi, decks and the other
#      submodules are never touched.
#   5. Publishes viz/ and starts "Deploy GitHub Pages" (build-pages.yml), because a push made with
#      the workflow token starts no other workflow. Where it publishes depends on the course repo:
#      - Build branch (when the repo's build-pages.yml has the "Add the code-viz build" step, which
#        names the code-viz-build branch): viz/ goes to the repo's own code-viz-build branch as one
#        commit whose message ends "Built-from: <gh-pages commit>", and gh-pages is never written.
#        Generated files are site specific (viz/index.json holds the site address), so keeping them
#        off gh-pages is what lets a semester repo and its parent merge without generated
#        conflicts. Before building, viz/ becomes the last build plus the viz/ changes made on
#        gh-pages since the commit it was built from (hand edits, recordings and deletions win),
#        so unchanged traces stay byte for byte and a build with no real change
#        publishes nothing (a rerun or a run by hand still deploys). Pushes retry five times; a run
#        never replaces a build of a newer commit.
#      - Commit (older repos without that step): commits viz/ to the branch as github-actions[bot]
#        ("[skip ci]"), fetching and rebasing first (five tries with growing randomized waits,
#        backing out a failed rebase).
name: code-viz build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    env:
      BUILD_BRANCH: code-viz-build
    steps:
      - name: Check out the course branch (no submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: false

      - name: Anything to build?
        id: any
        run: |
          if grep -rqs --include='*.md' '<!-- run:' _pages || [ -f viz/index.json ] || [ -f viz/manifest.json ] || [ -f viz/notebooks.json ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "No code-viz examples in this repo and no viz/ site; nothing to do."
          fi

      - name: Where does the build go?
        id: mode
        if: steps.any.outputs.go == '1'
        run: |
          if grep -qs "$BUILD_BRANCH" .github/workflows/build-pages.yml; then
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            echo "build-pages.yml lays $BUILD_BRANCH over viz/: publishing to $BUILD_BRANCH, not to $GITHUB_REF_NAME"
          else
            echo "mode=commit" >> "$GITHUB_OUTPUT"
            echo "build-pages.yml has no code-viz build step: committing viz/ to $GITHUB_REF_NAME"
          fi

      - name: Get code-viz
        if: steps.any.outputs.go == '1'
        run: |
          SHA=$(git ls-tree HEAD code | awk '$2 == "commit" {print $3}')
          git clone -q https://github.com/BillJr99/Ursinus-Boilerplate-Code.git "$RUNNER_TEMP/cv"
          if [ -n "$SHA" ]; then
            if ! git -C "$RUNNER_TEMP/cv" cat-file -e "$SHA^{commit}" 2>/dev/null; then
              echo "::error::the code submodule points at $SHA, which is not in Ursinus-Boilerplate-Code"
              exit 1
            fi
            git -C "$RUNNER_TEMP/cv" checkout -q "$SHA"
          fi
          echo "code-viz at $(git -C "$RUNNER_TEMP/cv" log --oneline -1)"

      - name: Start from the last build
        if: steps.mode.outputs.mode == 'branch'
        run: |
          if ! git ls-remote --exit-code --heads origin "$BUILD_BRANCH" >/dev/null; then
            echo "no $BUILD_BRANCH branch yet; building from viz/ as committed"
            exit 0
          fi
          git fetch -q origin "+refs/heads/$BUILD_BRANCH:refs/remotes/origin/$BUILD_BRANCH"
          BUILD="refs/remotes/origin/$BUILD_BRANCH"
          BASE=$(git log -1 --format=%B "$BUILD" | sed -n 's/^Built-from: \([0-9a-f]\{40\}\)$/\1/p' | head -n 1)
          if [ -z "$BASE" ] || ! git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
            echo "the last build's source commit (${BASE:-none}) is not in $GITHUB_REF_NAME; building from viz/ as committed"
            exit 0
          fi
          SNAP="$RUNNER_TEMP/last-build"
          mkdir -p "$SNAP"
          git archive "$BUILD" viz | tar -x -C "$SNAP"
          git diff --no-renames --name-only -z "$BASE" HEAD -- viz > "$RUNNER_TEMP/changed-since-build"
          python3 - "$SNAP" "$RUNNER_TEMP/changed-since-build" <<'PYTHON'
          # viz/ becomes the last build plus what changed on the branch since it was built: files
          # changed or added there are kept, files deleted there stay deleted, other files come from
          # the build, and files the build does not have are dropped.
          import os, shutil, sys
          snap, changed = sys.argv[1], sys.argv[2]
          keep = {p for p in open(changed, "rb").read().decode().split("\0") if p}
          def files(top):
              return {os.path.relpath(os.path.join(d, n), top) for d, _, ns in os.walk(os.path.join(top, "viz")) for n in ns}
          built = files(snap)
          dropped = [p for p in files(".") - built if p not in keep]
          for p in dropped:
              os.remove(p)
          for d in sorted((d for d, _, _ in os.walk("viz")), key=lambda d: -d.count(os.sep)):
              if d != "viz" and not os.listdir(d):
                  os.rmdir(d)                      # emptied by the drop
          laid, skipped = 0, []
          for p in sorted(built - keep):
              parts = p.split(os.sep)
              # The tree on the branch wins a file/folder clash: a file kept where the build has a folder,
              # or a folder (holding kept files) where the build has a file.
              if any(os.path.isfile(os.sep.join(parts[:i])) for i in range(1, len(parts))) or os.path.isdir(p):
                  skipped.append(p)
                  continue
              os.makedirs(os.path.dirname(p), exist_ok=True)
              # Copy to a temporary name, then rename: a failed write (a full disk) fails the step and never
              # leaves a truncated file to be published.
              shutil.copyfile(os.path.join(snap, p), p + ".code-viz-tmp")
              os.replace(p + ".code-viz-tmp", p)
              laid += 1
          print(f"laid {laid} file(s) of the build over viz/, dropped {len(dropped)} it does not have; kept {len(keep)} path(s) changed since it was built"
                + (f"; skipped {len(skipped)} that clash with kept files: {' '.join(skipped[:10])}" if skipped else ""))
          PYTHON

      - name: Build the examples
        if: steps.any.outputs.go == '1'
        run: python3 "$RUNNER_TEMP/cv/course/viz/code-viz" build --check

      - name: Only viz/ may change
        if: steps.any.outputs.go == '1'
        run: |
          OUTSIDE=$(git status --porcelain --untracked-files=all | grep -v -E '^.. viz/' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::code-viz changed files outside viz/; nothing was published"
            echo "$OUTSIDE"
            exit 1
          fi

      - name: Publish viz/ to the build branch
        id: branch
        if: steps.mode.outputs.mode == 'branch'
        shell: bash   # the retry waits use $RANDOM
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          SHA=$(git rev-parse HEAD)
          BUILD="refs/remotes/origin/$BUILD_BRANCH"
          # The build branch holds only viz/: stage it in an index of its own, leaving gh-pages alone.
          TREE=$(GIT_INDEX_FILE="$RUNNER_TEMP/build.index" sh -c 'git read-tree --empty && git add -A viz && git write-tree')
          built_from() { git log -1 --format=%B "$1" | sed -n 's/^Built-from: \([0-9a-f]\{40\}\)$/\1/p' | head -n 1; }
          for try in 1 2 3 4 5; do
            PARENT=$(git rev-parse -q --verify "$BUILD^{commit}" || true)
            if [ -n "$PARENT" ]; then
              if [ "$(git rev-parse "$PARENT^{tree}")" = "$TREE" ]; then
                echo "$BUILD_BRANCH already has this viz/"
                # A rerun or a run by hand may follow a deploy that never started: deploy again.
                if [ "$GITHUB_RUN_ATTEMPT" != 1 ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                  echo "pushed=1" >> "$GITHUB_OUTPUT"
                fi
                exit 0
              fi
              LAST=$(built_from "$PARENT")
              if [ -n "$LAST" ] && [ "$LAST" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$LAST" 2>/dev/null; then
                echo "$BUILD_BRANCH already has a build of a newer commit ($LAST); not replacing it"
                exit 0
              fi
            fi
            COMMIT=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} \
              -m "code-viz: build of $GITHUB_REF_NAME ${SHA:0:7}" -m "Built-from: $SHA")
            if git push -q origin "$COMMIT:refs/heads/$BUILD_BRANCH"; then
              echo "published $(git log --oneline -1 "$COMMIT") to $BUILD_BRANCH"
              echo "pushed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$try" -lt 5 ] && sleep $(( (5 << try) + RANDOM % (5 << try) ))
            git fetch -q origin "+refs/heads/$BUILD_BRANCH:$BUILD" || true
          done
          echo "::error::could not push $BUILD_BRANCH after five tries"
          exit 1

      - name: Commit viz/
        id: commit
        if: steps.mode.outputs.mode == 'commit'
        shell: bash   # the retry waits use $RANDOM
        run: |
          git add -A viz
          if git diff --cached --quiet; then
            echo "viz/ is already up to date"
            exit 0
          fi
          git diff --cached --stat | tail -3
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "code-viz: rebuild viz/ [skip ci]"
          # Five tries with growing, randomized waits (about 10 s, 20 s, 40 s, 80 s), so parallel jobs
          # pushing to the same branch don't retry in lockstep. Three fixed 15 s retries lost the race on
          # 2026-11-14, when about 17 pushes landed at once.
          for try in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            if git rebase -q "origin/$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            [ "$try" -lt 5 ] && sleep $(( (5 << try) + RANDOM % (5 << try) ))
          done
          echo "::error::could not push viz/ after five tries"
          exit 1

      - name: Publish the site
        if: steps.commit.outputs.pushed == '1' || steps.branch.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh workflow run build-pages.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"; then
            # Fail, so a rerun of this job (which finds the build already published) deploys it.
            echo "::error::could not start Deploy GitHub Pages; rerun this job or run Deploy GitHub Pages by hand"
            exit 1
          fi
