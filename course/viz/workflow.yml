# code-viz: course repo caller. Copy to .github/workflows/code-viz.yml in a course repo.
# The steps live in Ursinus-Boilerplate-Code/.github/workflows/code-viz.yml, so changing them there
# changes every course. Full manual: the header of code-viz (`code-viz readme`), section 16 CI.
#
# Runs on a push to gh-pages that changes the site config, pages, files, codeviz/ or viz/.
# Including viz/ rebuilds the destination when a course sync changes only generated files.
# You can also run it from Actions or from update-submodules.yml when the code submodule moves.
# The workflow publishes only viz/: to the code-viz-build branch when build-pages.yml has the
# "Add the code-viz build" step (course/viz/pages-step.yml), else to gh-pages. Its bot push does
# not start another code-viz run.
name: code-viz

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - "_pages/**.md"
      - "files/**"
      - "_config.yml"
      - ".github/workflows/code-viz.yml"
      - "viz/notebooks.json"
      - "viz/**"
      - "codeviz/**"

concurrency:
  group: code-viz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
      actions: write
    uses: BillJr99/Ursinus-Boilerplate-Code/.github/workflows/code-viz.yml@main
